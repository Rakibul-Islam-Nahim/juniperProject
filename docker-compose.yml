services:
  postgres:
    image: postgres:16-alpine
    container_name: labplatform-postgres
    environment:
      POSTGRES_DB: labplatform
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    ports:
      - "5432:5432"
    volumes:
      - labplatform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d labplatform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  labplatform_pgdata:
